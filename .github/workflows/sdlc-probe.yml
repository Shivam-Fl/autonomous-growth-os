# One real one-token request per model, with the runner's own key and headers. Started by
# `sdlc doctor --live`, which reads the uploaded probe.json and fails on any non-2xx.
name: sdlc-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - name: Provider
        id: prov
        run: node .sdlc/bin/provider-settings.mjs
      - name: One request per model
        env:
          ANTHROPIC_BASE_URL: ${{ steps.prov.outputs.base_url }}
          ANTHROPIC_CUSTOM_HEADERS: ${{ steps.prov.outputs.headers }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .sdlc/bin/claude-args.mjs --probe probe.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: sdlc-probe
          path: probe.json
