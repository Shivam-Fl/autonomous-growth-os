# Agent 10 — Watchdog. Pure script, every 15 minutes.
# Reclaims stale locks, trips budgets, surfaces stalls. The thing that stops a hung issue
# from sitting locked forever because an agent died mid-run.
name: sdlc-watchdog

on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write          # it dispatches intake to start a queued issue; without this the
                          # wake marks an issue in flight and then cannot start it

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
          # Only cache when there is a lockfile. Without this, setup-node fails outright on a
          # zero-dependency project or any non-Node repo, before a single step has run.
          cache: ${{ hashFiles('**/package-lock.json') != '' && 'npm' || '' }}
      - name: Kill switch
        run: node .sdlc/bin/sdlc-ctl.mjs guard
      # Works in a repo with no package.json: install the repo's own deps when there is a
      # manifest, then make sure the framework's single dependency is available either way.
      - name: Bootstrap
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          fi
          node .sdlc/bin/ensure-deps.mjs

      - name: Sweep every open ledger
        id: sweep
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: node .sdlc/bin/sdlc-ctl.mjs watchdog

      - name: Report anything that needs a human
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.sweep.outputs.report }}
        run: node .sdlc/bin/watchdog-report.mjs

      # Re-offer the start queue. This is the only thing in the framework that runs on a
      # clock, so it is the only thing that can notice a slot freed without a merge.
      #
      # `wake-dependents` was called from exactly one place — on-merge — so the queue was
      # re-offered only when a pull request merged and closed an issue. A slot also frees when
      # an issue stops at a human gate, exceeds its budget, or is closed by hand, and none of
      # those run any code. On this repo both slots went to issues that stopped at human gates
      # without ever claiming a lock: neither could close without a person, so no merge could
      # happen, so nothing re-offered the queue, and two ready issues waited behind a slot
      # nobody was holding. The pipeline could not restart itself.
      #
      # No CLOSED_ISSUE: top-up only. It wakes nothing when the cap is full, and nothing when
      # no issue is ready — so on a healthy repo this step is a no-op every fifteen minutes.
      # Issues parked waiting out a provider outage. This is the only thing in the framework
      # that runs on a clock, so it is the only thing that can start work again after a wait
      # that nothing else would notice — a quota limit clears silently, on its own schedule.
      - name: Start anything whose cooldown has passed
        if: always()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: node .sdlc/bin/resume-cooled-down.mjs

      - name: Start whatever is ready and has a slot
        if: always()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: node .sdlc/bin/wake-dependents.mjs
